# Google Cloud Build configuration for Cloud Run deployment
# This file automates building and deploying to Cloud Run

steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/gym-management-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/gym-management-backend:latest'
      - '.'

  # Push the Docker image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/gym-management-backend:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/gym-management-backend:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'gym-management-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/gym-management-backend:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - 'SPRING_PROFILES_ACTIVE=prod'

# Store images in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/gym-management-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/gym-management-backend:latest'

# Substitution variables (can be overridden)
substitutions:
  _REGION: 'asia-south1'  # Mumbai region - change as needed

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
