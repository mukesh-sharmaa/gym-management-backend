# Cloud Run Service Definition
# Use this for declarative deployments: gcloud run services replace cloudrun-service.yaml
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: gym-management-backend
  labels:
    cloud.googleapis.com/location: asia-south1
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # Scaling configuration
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        # CPU allocation
        run.googleapis.com/cpu-throttling: "true"
        # Startup probe timeout
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: default
      containers:
        - image: gcr.io/PROJECT_ID/gym-management-backend:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: 512Mi
              cpu: "1"
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            # Database configuration - use Secret Manager references
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-url
                  key: latest
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-username
                  key: latest
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-password
                  key: latest
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: latest
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: cors-allowed-origins
                  key: latest
          # Health check
          startupProbe:
            httpGet:
              path: /api/health/ping
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/health/ping
              port: 8080
            periodSeconds: 15
  traffic:
    - percent: 100
      latestRevision: true
