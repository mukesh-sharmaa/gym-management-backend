# Production Configuration - Google Cloud Run
spring.application.name=GymManagement

# =======================
# Database Configuration
# =======================
# For Cloud SQL, use: jdbc:mysql:///DB_NAME?cloudSqlInstance=PROJECT:REGION:INSTANCE&socketFactory=com.google.cloud.sql.mysql.SocketFactory
# For external MySQL (e.g., PlanetScale, Railway MySQL): jdbc:mysql://host:port/database
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Connection Pool Settings (optimized for Cloud Run - lower pool for serverless)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
# Enable connection validation for Cloud Run cold starts
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:21600000}

# CORS Configuration
cors.allowed.origins=${CORS_ALLOWED_ORIGINS}

# Server Configuration
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain

# Cloud Run: Graceful shutdown for container lifecycle
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Logging Configuration (Production - INFO level, JSON for Cloud Logging)
logging.level.root=INFO
logging.level.com.gymapp.gym_management=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Error handling
server.error.include-message=always
server.error.include-stacktrace=never
server.error.include-exception=false

# Actuator endpoints for health monitoring (optional)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
